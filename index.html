<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUITY — Incoming</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,600;1,600&family=Bungee&family=Caveat:wght@700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  /* ── SHELL TOKENS — identical set to phrasal-verbs-quiz.html ───────────
     Same two bar heights, same gold, same accent. The game's own palette
     (the proximity ladder) sits below and is additive. */
  :root{
    --gold:#C9A961; --gold-glow:rgba(201,169,97,.4);
    --mode-accent:#FFD94A; --mode-accent-rgb:255,217,74;
    --header-h:88px;
    --bar-h:34px;

    --clear:#5ED39B; --wrong:#E86A5C;
    --paper:#e5e5e7; --paper-dim:rgba(229,229,231,.55); --paper-faint:rgba(229,229,231,.24);
    --line:rgba(255,255,255,.08);

    /* stage ladder — cool ember to hot gold */
    --s0:#cdbf8e; --s0-glow:rgba(205,191,142,.5);
    --s1:#e8935a; --s1-glow:rgba(232,147,90,.55);
    --s2:#ff7a45; --s2-glow:rgba(255,122,69,.6);
    --s3:#ff4d4d; --s3-glow:rgba(255,77,77,.65);
    --s4:#ffd94a; --s4-glow:rgba(255,217,74,.8);
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d0d0d; }
  body{
    font-family:'DM Sans', sans-serif; color:var(--paper);
    user-select:none; -webkit-user-select:none;
  }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  /* ── HEADER — same construction as the quiz page ── */
  .header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; flex-direction:column; align-items:stretch; gap:.4rem;
    padding:.5rem 1.25rem .4rem;
    background:rgba(13,13,13,.88); backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.06); height:var(--header-h);
  }
  .header-top{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .header-title{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .app-title{ font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:900; letter-spacing:.22em; color:var(--gold); }
  .app-subtitle{ font-size:.58rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.32); margin-top:.1rem; }
  .back-link{
    justify-self:start; text-decoration:none; font-family:'Space Grotesk',sans-serif;
    font-size:.6rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:rgba(255,255,255,.3); transition:color .2s; white-space:nowrap;
  }
  .back-link:hover{ color:rgba(255,255,255,.7); }
  .header-spacer{ justify-self:end; }

  .mode-selector{
    display:flex; justify-content:center; align-self:center;
    background:rgba(28,28,30,.6); backdrop-filter:blur(40px);
    border-radius:999px; border:1px solid rgba(201,169,97,.2); overflow:hidden;
  }
  .mode-btn{
    display:flex; align-items:center; gap:.4rem;
    font-family:'Space Grotesk',sans-serif; font-size:.66rem; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase;
    padding:.5rem 1.05rem; border-right:1px solid rgba(84,84,88,.2);
    color:#636366; transition:background .2s ease, color .2s ease;
  }
  .mode-btn:last-child{ border-right:none; }
  .mode-btn:hover{ color:#9ca3af; background:rgba(201,169,97,.1); }
  .mode-btn.active{ background:rgba(201,169,97,.15); color:var(--gold); }
  .mode-icon{ font-size:.82rem; line-height:1; opacity:.55; }
  .mode-btn.active .mode-icon{ opacity:.9; }
  .mode-badge{ font-size:.58rem; font-weight:600; color:rgba(255,255,255,.28); font-variant-numeric:tabular-nums; }
  .mode-btn.active .mode-badge{ color:rgba(201,169,97,.6); }
  @media(max-width:760px){
    .mode-btn .mode-label{ display:none; }
    .mode-btn{ padding:.5rem .6rem .5rem .5rem; }
  }

  /* ── STAGE + CARD — same frame the quiz uses ── */
  .stage{
    position:fixed; top:var(--header-h); left:0; right:0; bottom:var(--bar-h);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:.5rem;
  }
  .slide-card{
    position:relative; width:100%; max-width:min(94vw,1200px); flex:1;
    background:linear-gradient(145deg, rgba(28,28,30,.97), rgba(18,18,20,.99));
    border-radius:1.25rem; border:1px solid rgba(201,169,97,.22); overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.8), 0 0 80px rgba(201,169,97,.07);
    display:flex; flex-direction:column; min-height:0;
  }
  .slide-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--screen-accent, var(--gold)); opacity:.7; transition:background .4s; z-index:6;
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar{
    position:fixed; bottom:0; left:0; right:0; height:var(--bar-h); padding:.3rem 1rem;
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    background:rgba(13,13,13,.88); backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.06);
  }
  .barleft, .barright{ display:flex; align-items:center; gap:.85rem; font-size:.7rem; font-weight:700; color:rgba(229,229,231,.35); }
  .score-item{ display:flex; align-items:center; gap:.35rem; }
  .score-dot{ width:7px; height:7px; border-radius:50%; }
  .score-dot.ok{ background:var(--clear); } .score-dot.bad{ background:var(--wrong); }
  .score-num{ font-variant-numeric:tabular-nums; }
  .barstage{ font-family:'Space Grotesk',sans-serif; font-size:.55rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.3); }
  .barstage b{ color:var(--gold); font-weight:700; }

  /* ── LOADING ── */
  .loading-screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0d0d0d; z-index:999; transition:opacity .6s; }
  .loading-screen.fade{ opacity:0; pointer-events:none; }
  .ld{ width:7px; height:7px; border-radius:50%; background:var(--gold); animation:ld 1.2s ease-in-out infinite; }
  @keyframes ld{ 0%,100%{opacity:.2; transform:scale(.7)} 50%{opacity:1; transform:scale(1.3)} }
  .loaderr{ font-size:.8rem; color:var(--wrong); max-width:30rem; text-align:center; line-height:1.6; }

  /* ══════════════════════════ GAME INTERIOR ══════════════════════════
     Everything below is the game's own. The menu is deliberately NOT a tab
     strip: the verb grid with its mastery states is the map, and it says
     more than tabs can. */
  .screen{ position:absolute; inset:0; display:none; flex-direction:column; min-height:0; }
  .screen.active{ display:flex; }

  /* ---------- MENU ---------- */
  #menu{ overflow-y:auto; padding:1.1rem 1.4rem 1.8rem; }
  .stagebar{ display:flex; align-items:center; justify-content:center; gap:clamp(.4rem,2vw,1.1rem); padding:.3rem 0 .9rem; }
  .stagenode{ display:flex; flex-direction:column; align-items:center; gap:.3rem; width:56px; }
  .stagenode .dot{ width:30px; height:30px; }
  .stagenode svg{ width:100%; height:100%; }
  .stagenode .lbl{ font-family:'DM Mono',monospace; font-size:.52rem; letter-spacing:.08em; text-transform:uppercase; color:var(--paper-faint); }
  .stagenode.done .lbl{ color:var(--paper-dim); }
  .stagenode.current .lbl{ color:var(--mode-accent); font-weight:500; }
  .stagelink{ width:clamp(10px,3vw,26px); height:1px; background:var(--line); margin-top:-18px; flex-shrink:0; }
  .stagelink.done{ background:var(--gold); }

  .stagecaption{ text-align:center; font-family:'DM Mono',monospace; font-size:.66rem; color:var(--paper-dim); margin-bottom:1.1rem; }
  .stagecaption b{ color:var(--mode-accent); }

  .sectiontitle{
    font-family:'DM Mono',monospace; font-size:.58rem; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(229,229,231,.4); margin:.7rem 0 .55rem;
  }
  .verbgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:.5rem; margin-bottom:1.2rem; }
  .verbcard{
    position:relative; cursor:pointer; text-align:left; border:1px solid var(--line); border-radius:10px;
    padding:.65rem .7rem; background:rgba(255,255,255,.02); overflow:hidden;
    display:flex; flex-direction:column; gap:.25rem; min-height:64px;
    transition:transform .12s, border-color .12s, background .12s;
  }
  .verbcard::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--vcolor,var(--gold)); opacity:.55; }
  .verbcard:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,.28); background:rgba(255,255,255,.045); }
  .verbcard .vname{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.82rem; }
  .verbcard .vmeta{ font-family:'DM Mono',monospace; font-size:.56rem; color:var(--paper-faint); }
  .verbcard .vstars{ font-size:.62rem; letter-spacing:.1em; color:var(--mode-accent); min-height:.9em; }
  .verbcard.mastered{ border-color:rgba(255,217,74,.4); background:rgba(255,217,74,.05); }
  .verbcard.mastered .vname{ color:var(--mode-accent); }

  .mixgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:.6rem; }
  .mixcard{
    cursor:pointer; text-align:left; border:1px solid var(--line); border-radius:10px; padding:.7rem .8rem .6rem;
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));
    display:flex; flex-direction:column; gap:.3rem; min-height:80px; transition:transform .12s, border-color .12s;
  }
  .mixcard:hover{ transform:translateY(-2px); border-color:rgba(255,217,74,.35); }
  .mixcard .num{ font-family:'DM Mono',monospace; font-size:.58rem; color:var(--paper-faint); letter-spacing:.1em; }
  .mixcard .name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.85rem; }
  .mixcard .stars{ font-size:.75rem; letter-spacing:.12em; color:var(--mode-accent); min-height:1em; }
  .mixcard .pct{ font-family:'DM Mono',monospace; font-size:.58rem; color:var(--paper-dim); }

  .trialcard{
    margin-top:1.1rem; border:1px solid rgba(255,217,74,.35); border-radius:12px; padding:1rem 1.1rem;
    background:radial-gradient(ellipse at 30% 0%, rgba(255,217,74,.08), transparent 70%);
    display:flex; align-items:center; gap:.9rem; cursor:pointer; transition:transform .12s;
  }
  .trialcard:hover{ transform:translateY(-2px); }
  .trialcard.locked{ opacity:.4; cursor:default; pointer-events:none; }
  .trialcard .icon{ width:34px; height:34px; flex-shrink:0; }
  .trialcard .tt{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.95rem; color:var(--mode-accent); }
  .trialcard .td{ font-size:.72rem; color:var(--paper-dim); margin-top:.1rem; }

  /* ---------- PLAY ---------- */
  .hud{ display:flex; align-items:center; gap:1rem; padding:.7rem 1rem .4rem; font-family:'DM Mono',monospace; font-size:.68rem; flex-shrink:0; }
  .hud .spacer{ flex:1; }
  .hit{ color:var(--clear); } .miss{ color:var(--wrong); } .streak{ color:var(--gold); }
  .streak.hot{ color:var(--mode-accent); }
  .clock{ font-size:.72rem; padding:.15rem .5rem; border-radius:6px; background:rgba(255,255,255,.04); font-variant-numeric:tabular-nums; }
  .clock.low{ color:var(--wrong); background:rgba(232,106,92,.12); }
  .backbtn{ font-family:'DM Mono',monospace; font-size:.62rem; color:var(--paper-faint); letter-spacing:.05em; }
  .backbtn:hover{ color:var(--paper); }

  .prompt{ margin:.3rem 1rem 0; padding:.7rem 1rem; text-align:center; border-left:2px solid var(--mode-accent); background:rgba(255,217,74,.05); flex-shrink:0; }
  .promptlabel{ font-family:'DM Mono',monospace; font-size:.55rem; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,217,74,.65); margin-bottom:.3rem; }
  .prompttext{ font-size:clamp(.85rem,2.2vw,1rem); }

  .field{ position:relative; flex:1; min-height:0; margin:.6rem .6rem 1rem; overflow:hidden; }
  .field::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(18,18,20,.9) 100%);
  }
  .word{ position:absolute; left:0; top:0; will-change:transform,opacity,filter; white-space:nowrap; cursor:pointer; }
  .word.wrong{ color:var(--wrong)!important; }
  .spark{ position:absolute; width:5px; height:5px; border-radius:50%; pointer-events:none; z-index:4; }

  .toast{
    position:absolute; left:50%; bottom:1rem; transform:translate(-50%,10px);
    background:#0d0d0d; border:1px solid rgba(255,255,255,.16); border-left:2px solid var(--wrong);
    padding:.55rem .85rem; font-size:.72rem; max-width:min(90%,460px); text-align:left;
    opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:8;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  .toast b{ font-family:'Space Grotesk',sans-serif; color:var(--wrong); }
  .toast span{ color:var(--paper-dim); }
  .toast.good{ border-left-color:var(--clear); } .toast.good b{ color:var(--clear); }

  /* ---------- SUMMARY ---------- */
  #summary{ align-items:center; justify-content:center; text-align:center; padding:1.5rem; gap:.4rem; }
  .sumeyebrow{ font-family:'DM Mono',monospace; font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--paper-faint); }
  .sumverdict{ font-family:'Space Grotesk',sans-serif; font-weight:900; font-size:clamp(1.6rem,5vw,2.4rem); letter-spacing:-.02em; margin:.3rem 0; }
  .sumverdict.cleared{ color:var(--clear); } .sumverdict.short{ color:var(--wrong); }
  .sumstars{ font-size:1.4rem; letter-spacing:.15em; color:var(--mode-accent); min-height:1.4rem; }
  .sumstats{ display:flex; gap:1.6rem; margin:.9rem 0 1.2rem; font-family:'DM Mono',monospace; font-size:.72rem; color:var(--paper-dim); }
  .sumstats div{ display:flex; flex-direction:column; align-items:center; gap:.15rem; }
  .sumstats b{ font-family:'Space Grotesk',sans-serif; font-size:1.15rem; color:var(--paper); }
  .sumactions{ display:flex; gap:.6rem; margin-top:.2rem; flex-wrap:wrap; justify-content:center; }
  .sumbtn{
    font-family:'Space Grotesk',sans-serif; font-size:.62rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
    padding:.75rem 1.6rem; border-radius:999px; border:1px solid rgba(255,255,255,.15); color:rgba(229,229,231,.5); transition:all .16s;
  }
  .sumbtn:hover{ border-color:rgba(255,255,255,.35); color:var(--paper); }
  .sumbtn.primary{ background:var(--mode-accent); color:#0d0d0d; border:2px solid var(--mode-accent); }
  .sumnote{ font-size:.7rem; color:var(--paper-faint); margin-top:1rem; max-width:380px; line-height:1.6; }

  /* ---------- STAGE-UP ---------- */
  #stageup{
    position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.55), rgba(0,0,0,.94)); backdrop-filter:blur(3px); cursor:pointer;
  }
  #stageup.show{ display:flex; }
  #stageup .ic{ width:96px; height:96px; margin-bottom:.6rem; filter:drop-shadow(0 0 24px var(--glowcol,rgba(255,217,74,.6))); }
  #stageup .eyebrow{ font-family:'DM Mono',monospace; font-size:.62rem; letter-spacing:.25em; text-transform:uppercase; color:var(--paper-dim); }
  #stageup .name{ font-family:'Space Grotesk',sans-serif; font-weight:900; font-size:clamp(1.8rem,6vw,2.6rem); margin:.15rem 0 .5rem; }
  #stageup .desc{ font-size:.78rem; color:var(--paper-dim); max-width:320px; }
  #stageup .tap{ font-family:'DM Mono',monospace; font-size:.6rem; color:var(--paper-faint); margin-top:1.4rem; }

  @media(max-width:600px){
    :root{ --header-h:78px; }
    .verbgrid{ grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); }
    #menu{ padding:.9rem .9rem 1.4rem; }
  }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen"><div class="ld"></div></div>

<header class="header">
  <div class="header-top">
    <a class="back-link" href="/?openModal=grammar">← Grammar</a>
    <div class="header-title">
      <div class="app-title">INTUITY</div>
      <div class="app-subtitle">Phrasal Verbs</div>
    </div>
    <div class="header-spacer" aria-hidden="true"></div>
  </div>
  <div class="mode-selector">
    <button class="mode-btn" data-href="phrasal-verbs-quiz.html"><span class="mode-icon">✎</span><span class="mode-label">Learn</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-quiz.html"><span class="mode-icon">⚡</span><span class="mode-label">Quiz</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-quiz.html"><span class="mode-icon">✍</span><span class="mode-label">Practice</span></button>
    <button class="mode-btn" data-href="phrasal-verbs-quiz.html"><span class="mode-icon">🔗</span><span class="mode-label">Match</span></button>
    <button class="mode-btn active"><span class="mode-icon">🎯</span><span class="mode-label">Play</span><span class="mode-badge">2m</span></button>
  </div>
</header>

<div class="stage">
  <div class="slide-card" id="card">

    <!-- MENU -->
    <section class="screen active" id="menu">
      <div class="stagebar" id="stagebar"></div>
      <div class="stagecaption" id="stagecaption"></div>

      <div class="sectiontitle">Practice one set</div>
      <div class="verbgrid" id="verbgrid"></div>

      <div class="sectiontitle">Revision — every set shuffled together</div>
      <div class="mixgrid" id="revgrid"></div>

      <div class="trialcard locked" id="trialcard">
        <svg class="icon" viewBox="0 0 24 24"><path id="trialIconPath" d="M2 18l3-11 5 4 4-7 4 7 5-4 3 11H2z" fill="#5a5a52"/></svg>
        <div>
          <div class="tt" id="trialTitle">Final Trial — locked</div>
          <div class="td" id="trialDesc">Clear every set to unlock the Crown trial.</div>
        </div>
      </div>
    </section>

    <!-- PLAY -->
    <section class="screen" id="play">
      <div class="hud">
        <button class="backbtn" id="backBtn">← map</button>
        <span class="hit"><span id="hitVal">0</span> hit</span>
        <span class="miss"><span id="missVal">0</span> missed</span>
        <span class="spacer"></span>
        <span class="streak" id="streakLabel">streak <span id="streakVal">0</span></span>
        <span class="clock" id="clockVal">2:00</span>
      </div>
      <div class="prompt">
        <div class="promptlabel" id="mixLabel">Match this meaning</div>
        <p class="prompttext" id="promptText">…</p>
      </div>
      <div class="field" id="field"></div>
      <div class="toast" id="toast"></div>
    </section>

    <!-- SUMMARY -->
    <section class="screen" id="summary">
      <div class="sumeyebrow" id="sumEyebrow">PRACTICE</div>
      <div class="sumverdict" id="sumVerdict">Cleared</div>
      <div class="sumstars" id="sumStars"></div>
      <div class="sumstats">
        <div><b id="sumHits">0</b><span>hit</span></div>
        <div><b id="sumMiss">0</b><span>missed</span></div>
        <div><b id="sumAcc">0%</b><span>accuracy</span></div>
      </div>
      <div class="sumactions">
        <button class="sumbtn primary" id="sumRetry">↺ Retry</button>
        <button class="sumbtn" id="sumNext">Back to map</button>
      </div>
      <div class="sumnote" id="sumNote"></div>
    </section>

    <div id="stageup">
      <svg class="ic" id="stageupIcon" viewBox="0 0 24 24"></svg>
      <div class="eyebrow">New stage</div>
      <div class="name" id="stageupName"></div>
      <div class="desc" id="stageupDesc"></div>
      <div class="tap">tap to continue</div>
    </div>

  </div>
</div>

<div class="bottom-bar">
  <div class="barleft">
    <div class="score-item"><div class="score-dot ok"></div><span class="score-num" id="barHit">0</span></div>
    <div class="score-item"><div class="score-dot bad"></div><span class="score-num" id="barMiss">0</span></div>
  </div>
  <div class="barright"><span class="barstage" id="barStage">—</span></div>
</div>

<script>
/* ======================================================================
   INCOMING — words rise out of the dark and grow as they close in.

   Reads the SAME phrasal-verbs-data.json the quiz page uses. There is no
   embedded copy: a correction to the data lands here automatically, and the
   two pages can never drift apart. Groups in that file — including the MIX
   sets — are the practice unit, so the game's map matches the quiz's tabs.
====================================================================== */

const DATA_URL = 'phrasal-verbs-data.json';

/* ---------- tuning ---------- */
const EXPOSURE_CAP    = 3;    // times a phrase can be the target before resting
const REST_SPAWNS     = 20;   // spawns before a rested phrase returns
const ROUND_SECONDS   = 120;
const CLEAR_THRESHOLD = 0.60;
const TRIAL_THRESHOLD = 0.75;
const N_REVISION      = 5;

const STAGES = [
  { key:'spark', label:'Spark', color:'var(--s0)', glow:'var(--s0-glow)', desc:'You can spot a phrasal verb when you see one. First sets cleared.' },
  { key:'ember', label:'Ember', color:'var(--s1)', glow:'var(--s1-glow)', desc:'The patterns are starting to stick. Keep clearing sets.' },
  { key:'flame', label:'Flame', color:'var(--s2)', glow:'var(--s2-glow)', desc:'Recall is getting fast. Halfway through the full course.' },
  { key:'blaze', label:'Blaze', color:'var(--s3)', glow:'var(--s3-glow)', desc:'Nearly every set is in play. One push to the trial.' },
  { key:'crown', label:'Crown', color:'var(--s4)', glow:'var(--s4-glow)', desc:'Every set cleared and the Final Trial passed. Full mastery.' },
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[(Math.random()*a.length)|0];
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };

/* ---------- state filled on load ---------- */
let GROUPS = [], FULL_POOL = [], REVISION_MIXES = [], THRESH = [], N_GROUPS = 0;

/* ======================================================================
   LOAD
====================================================================== */
async function boot(){
  let data;
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    /* Opened from the file system, fetch is blocked by the browser. Say so
       plainly rather than showing a dead spinner. */
    $('loadingScreen').innerHTML =
      `<p class="loaderr">Couldn't load <b>${DATA_URL}</b>.<br>` +
      `Open this page from the site rather than as a local file — browsers block file:// data requests.</p>`;
    console.error(e);
    return;
  }

  GROUPS = data.verbs.map(g => ({
    id: g.id, label: g.label, color: g.color, mixed: !!g.mixed,
    items: g.items.map(it => {
      /* Items in a MIX group carry their own `verb`; `form` is the inflected
         verb the example sentence needs. The phrase label always uses the
         citation form, the sentence always uses the inflected one. */
      const base = it.verb || g.id;
      const infl = it.form || base;
      return {
        p: (base + ' ' + it.particle).toUpperCase(),
        m: it.meaning,
        s: it.example.replace(/_+/, (infl + ' ' + it.particle).toLowerCase()),
        group: g.id, color: g.color
      };
    })
  }));

  GROUPS.forEach(g => g.items.forEach(it => FULL_POOL.push(it)));
  N_GROUPS = GROUPS.length;

  /* Revision: one item from each set in turn, cycling — so a learner who
     never picks a particular set still meets it, and the sets are built
     deterministically so "Revision 3" is always the same phrases. */
  const interleaved = [];
  for (let row = 0; interleaved.length < FULL_POOL.length; row++) {
    GROUPS.forEach(g => { if (g.items[row]) interleaved.push(g.items[row]); });
  }
  const size = Math.ceil(interleaved.length / N_REVISION);
  for (let i = 0; i < interleaved.length; i += size) REVISION_MIXES.push(interleaved.slice(i, i + size));

  const s2 = Math.max(1, Math.ceil(N_GROUPS*0.2));
  const s3 = Math.max(s2+1, Math.ceil(N_GROUPS*0.45));
  const s4 = Math.max(s3+1, Math.ceil(N_GROUPS*0.75));
  THRESH = [0, s2, s3, s4, N_GROUPS];

  $('loadingScreen').classList.add('fade');
  setTimeout(() => $('loadingScreen').style.display = 'none', 600);
  renderMenu();
}

/* ======================================================================
   PROGRESS
====================================================================== */
function makeStore(key){
  let mem = null, usable = true;
  try { localStorage.setItem('__probe__','1'); localStorage.removeItem('__probe__'); } catch(e){ usable = false; }
  return {
    read(){ if(!usable) return mem; try{ const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; }catch(e){ return null; } },
    write(d){ mem = d; if(!usable) return; try{ localStorage.setItem(key, JSON.stringify(d)); }catch(e){ usable = false; } }
  };
}
const store = makeStore('incoming.progress.v3');
let progress = store.read() || { groupResults:{}, revResults:{}, phraseStats:{}, trialPassed:false, trialBest:0 };
progress.groupResults = progress.groupResults || {};
progress.revResults   = progress.revResults   || {};
progress.phraseStats  = progress.phraseStats  || {};
const save = () => store.write(progress);
const pstat = p => (progress.phraseStats[p] = progress.phraseStats[p] || { hits:0, misses:0 });
const clearedCount = () => Object.values(progress.groupResults).filter(r => r.cleared).length;
function currentStageIndex(){
  const c = clearedCount();
  if (c >= THRESH[4] && progress.trialPassed) return 4;
  if (c >= THRESH[3]) return 3;
  if (c >= THRESH[2]) return 2;
  if (c >= THRESH[1]) return 1;
  return 0;
}
const groupMastered = g => g.items.every(it => (progress.phraseStats[it.p]?.hits || 0) > 0);

/* ---------- icons ---------- */
const FLAME = "M12 2c.4 2.6-1 4-2.4 5.6C8.2 9.3 7 11 7 13.2A5 5 0 0 0 12 18a5 5 0 0 0 5-4.8c0-1.6-.7-2.7-1.6-3.7.2 1.4-.3 2.3-1 2.9.3-2.6-1-4-1.6-5.5C12.4 5.6 12.3 3.7 12 2z";
const CROWN = "M2 18l3-11 5 4 4-7 4 7 5-4 3 11H2z";
function svgIcon(i, col){
  const c = col || `var(--s${i})`;
  if (i === 0) return `<circle cx="12" cy="12" r="4.5" fill="${c}"/>`;
  if (i === 1) return `<circle cx="12" cy="12" r="5" fill="${c}"/><circle cx="12" cy="12" r="8" fill="none" stroke="${c}" stroke-opacity=".35"/>`;
  if (i === 4) return `<path d="${CROWN}" fill="${c}"/><circle cx="6" cy="9" r="1" fill="${c}"/><circle cx="18" cy="9" r="1" fill="${c}"/><circle cx="12" cy="6" r="1" fill="${c}"/>`;
  return `<path d="${FLAME}" fill="${c}"/>`;
}
const starsFor = a => a >= .9 ? '★★★' : a >= .7 ? '★★☆' : a >= CLEAR_THRESHOLD ? '★☆☆' : '';

/* ======================================================================
   MENU
====================================================================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function renderMenu(){
  showScreen('menu');
  document.documentElement.style.setProperty('--screen-accent', 'var(--gold)');
  const stageIdx = currentStageIndex();
  const cleared = clearedCount();

  const bar = $('stagebar'); bar.innerHTML = '';
  STAGES.forEach((s,i) => {
    if (i > 0) {
      const link = document.createElement('div');
      link.className = 'stagelink' + (i <= stageIdx ? ' done' : '');
      bar.appendChild(link);
    }
    const node = document.createElement('div');
    node.className = 'stagenode' + (i < stageIdx ? ' done' : '') + (i === stageIdx ? ' current' : '');
    node.innerHTML = `<div class="dot"><svg viewBox="0 0 24 24">${svgIcon(i, i <= stageIdx ? `var(--s${i})` : 'rgba(229,229,231,.22)')}</svg></div><div class="lbl">${s.label}</div>`;
    bar.appendChild(node);
  });

  const cap = $('stagecaption');
  if (stageIdx < 4) {
    const remain = Math.max(0, THRESH[stageIdx+1] - cleared);
    cap.innerHTML = stageIdx === 3
      ? (cleared >= N_GROUPS ? `All sets cleared — <b>Final Trial</b> unlocked below.` : `Clear <b>${remain}</b> more set${remain===1?'':'s'} to unlock the Final Trial.`)
      : `Clear <b>${remain}</b> more set${remain===1?'':'s'} to reach <b>${STAGES[stageIdx+1].label}</b>.`;
  } else {
    cap.innerHTML = `<b>Crown</b> reached. Full mastery of the course.`;
  }
  $('barStage').innerHTML = `Stage <b>${STAGES[stageIdx].label}</b> · ${cleared}/${N_GROUPS} sets`;
  $('barHit').textContent = 0; $('barMiss').textContent = 0;

  const vgrid = $('verbgrid'); vgrid.innerHTML = '';
  GROUPS.forEach(g => {
    const res = progress.groupResults[g.id];
    const card = document.createElement('div');
    card.className = 'verbcard' + (groupMastered(g) ? ' mastered' : '');
    card.style.setProperty('--vcolor', g.color);
    card.innerHTML = `
      <span class="vname">${g.label}</span>
      <span class="vmeta">${g.items.length} phrase${g.items.length===1?'':'s'}${res ? ` · best ${Math.round(res.bestAccuracy*100)}%` : ''}</span>
      <span class="vstars">${res ? starsFor(res.bestAccuracy) : ''}</span>`;
    card.onclick = () => startGroup(g.id);
    vgrid.appendChild(card);
  });

  const rgrid = $('revgrid'); rgrid.innerHTML = '';
  REVISION_MIXES.forEach((mix,i) => {
    const res = progress.revResults[i];
    const card = document.createElement('div');
    card.className = 'mixcard';
    card.innerHTML = `
      <span class="num">REVISION ${i+1}</span>
      <span class="name">${mix.length} phrases</span>
      <span class="stars">${res ? starsFor(res.bestAccuracy) : ''}</span>
      ${res ? `<span class="pct">best ${Math.round(res.bestAccuracy*100)}%</span>` : ''}`;
    card.onclick = () => startRevision(i);
    rgrid.appendChild(card);
  });

  const all = cleared >= N_GROUPS;
  const tc = $('trialcard');
  tc.classList.toggle('locked', !all);
  $('trialIconPath').setAttribute('fill', all ? (progress.trialPassed ? 'var(--s4)' : 'var(--gold)') : '#5a5a52');
  $('trialTitle').textContent = progress.trialPassed ? 'Final Trial — Crown earned' : (all ? 'Final Trial — ready' : 'Final Trial — locked');
  $('trialDesc').textContent = progress.trialPassed
    ? `Best score ${Math.round(progress.trialBest*100)}%. Replay any time.`
    : (all ? `The phrases you've missed most, from every set. Score ${Math.round(TRIAL_THRESHOLD*100)}%+ to earn the Crown.`
           : 'Clear every set to unlock the Crown trial.');
  tc.onclick = all ? startTrial : null;
}

/* ======================================================================
   ROUND
====================================================================== */
let round = null;

function startGroup(id){
  const g = GROUPS.find(x => x.id === id);
  beginRound({ mode:'group', index:id, pool:g.items, label:`${g.label} · match this meaning`, accent:g.color });
}
function startRevision(i){
  beginRound({ mode:'revision', index:i, pool:REVISION_MIXES[i], label:`REVISION ${i+1} · match this meaning`, accent:'var(--gold)' });
}
function startTrial(){
  /* Weighted toward phrases this learner has actually missed — the trial is
     their own error history, not a random sample. */
  const bag = [];
  FULL_POOL.forEach(it => {
    const st = progress.phraseStats[it.p];
    const total = st ? st.hits + st.misses : 0;
    const missRatio = total ? st.misses/total : 0.5;
    const w = Math.max(1, Math.round((1 + missRatio*4) * 2));
    for (let k=0;k<w;k++) bag.push(it);
  });
  const pool = [...new Set(shuffle(bag))].slice(0, 24);
  beginRound({ mode:'trial', index:null, pool: pool.length ? pool : shuffle(FULL_POOL).slice(0,24),
               label:'FINAL TRIAL · match this meaning', accent:'var(--s4)' });
}

function beginRound(cfg){
  round = {
    mode:cfg.mode, index:cfg.index, poolItems:cfg.pool, active:[...cfg.pool], resting:[],
    exposure:{}, weight:{}, coverage:new Set(),
    target:null, targetSpawned:false, forceIn:0, targetLifeBonus:1,
    hits:0, misses:0, streak:0, timeLeft:ROUND_SECONDS,
    live:new Set(), spawnTimer:null, clockTimer:null, rafId:null
  };
  cfg.pool.forEach(it => { round.exposure[it.p] = 0; round.weight[it.p] = 1; });

  document.documentElement.style.setProperty('--screen-accent', cfg.accent);
  $('mixLabel').textContent = cfg.label;
  $('hitVal').textContent = 0; $('missVal').textContent = 0; $('streakVal').textContent = 0;
  $('barHit').textContent = 0; $('barMiss').textContent = 0;
  $('streakLabel').classList.remove('hot');
  $('clockVal').textContent = fmtClock(round.timeLeft);
  $('clockVal').classList.remove('low');
  $('field').innerHTML = '';
  hideToast();

  showScreen('play');
  newTarget();
  round.rafId = requestAnimationFrame(frame);
  spawnWord();
  round.spawnTimer = setInterval(spawnWord, 1480);
  round.clockTimer = setInterval(tickClock, 1000);
}

const fmtClock = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');

function tickClock(){
  round.timeLeft--;
  $('clockVal').textContent = fmtClock(Math.max(0, round.timeLeft));
  $('clockVal').classList.toggle('low', round.timeLeft <= 15);
  if (round.timeLeft <= 0) endRound();
}

function weightedPick(){
  const bag = [];
  round.active.forEach(it => { for(let i=0;i<round.weight[it.p];i++) bag.push(it); });
  return bag.length ? bag[(Math.random()*bag.length)|0] : (round.active[0] || round.poolItems[0]);
}

function newTarget(){
  if (!round.active.length) refillFromResting();
  round.target = weightedPick();
  $('promptText').textContent = round.target.m;
  round.targetSpawned = false;
  /* Some glosses pack two or three senses into one line. That's more to hold
     in mind before scanning even starts, so it earns extra time: more decoys
     pass first, and the target itself grows more slowly. */
  const complexity = (round.target.m.match(/;/g)||[]).length + (round.target.m.match(/\bor\b/g)||[]).length;
  round.forceIn = randInt(3,5) + complexity;
  round.targetLifeBonus = 1 + complexity * 0.22;
}

function refillFromResting(){
  if (!round.resting.length) return;
  round.resting.sort((a,b) => a.left - b.left);
  const rec = round.resting.shift();
  round.exposure[rec.item.p] = 0; round.weight[rec.item.p] = 1;
  round.active.push(rec.item);
}
function tickRestCounters(){
  for (let i = round.resting.length-1; i >= 0; i--){
    if (--round.resting[i].left <= 0){
      const rec = round.resting.splice(i,1)[0];
      round.exposure[rec.item.p] = 0; round.weight[rec.item.p] = 1;
      round.active.push(rec.item);
    }
  }
}

/* ---------- field ---------- */
const STYLES = [
  { family:"'Space Grotesk',sans-serif", weight:700, style:'normal', case:'upper', tracking:'.01em', sizeMul:1.00 },
  { family:"'Fraunces',serif",           weight:600, style:'italic', case:'title', tracking:'0em',   sizeMul:1.05 },
  { family:"'Archivo Black',sans-serif", weight:400, style:'normal', case:'upper', tracking:'-.01em',sizeMul:0.92 },
  { family:"'Bungee',cursive",           weight:400, style:'normal', case:'upper', tracking:'0em',   sizeMul:0.85 },
  { family:"'Caveat',cursive",           weight:700, style:'normal', case:'title', tracking:'.01em', sizeMul:1.35 },
];
const styledText = (p,c) => c === 'title' ? p.toLowerCase().replace(/\b\w/g, x => x.toUpperCase()) : p;

function decoyItem(){
  /* Two thirds of the time pull something from the target's own set: a
     half-match on verb or particle is the real confusion, and a random word
     from elsewhere is no test at all. */
  if (Math.random() < 0.65) {
    const same = round.active.filter(it => it.group === round.target.group && it.p !== round.target.p);
    if (same.length) return pick(same);
  }
  const universe = round.active.concat(round.resting.map(r => r.item)).filter(it => it.p !== round.target.p);
  return universe.length ? pick(universe) : round.target;
}

function findSpawnSpot(fw, fh){
  let best = null, bestScore = -1;
  for (let i=0;i<10;i++){
    const cx = rand(fw*.18, fw*.82), cy = rand(fh*.15, fh*.8);
    let minDist = Infinity;
    round.live.forEach(r => { const d = Math.hypot(cx-r.x, cy-r.y) - (r.radius||20); if (d < minDist) minDist = d; });
    if (minDist > bestScore){ bestScore = minDist; best = {x:cx, y:cy}; }
  }
  return best;
}

function spawnWord(){
  if (!round) return;
  tickRestCounters();

  let item;
  if (!round.targetSpawned){ item = (--round.forceIn <= 0) ? round.target : decoyItem(); }
  else item = decoyItem();
  if (item.p === round.target.p) round.targetSpawned = true;

  const field = $('field');
  const el = document.createElement('div');
  el.className = 'word';
  const v = pick(STYLES);
  el.textContent = styledText(item.p, v.case);
  el.style.fontFamily = v.family; el.style.fontWeight = v.weight; el.style.fontStyle = v.style;
  el.style.letterSpacing = v.tracking; el.style.color = item.color;

  const {x,y} = findSpawnSpot(field.clientWidth, field.clientHeight);
  const pace = Math.max(0.78, 1 - round.streak*0.02);
  const isTarget = item.p === round.target.p;
  const life = rand(6200, 9200) * pace * (isTarget ? round.targetLifeBonus : 1);

  field.appendChild(el);
  const rec = { el, x, y, born:performance.now(), life, phrase:item.p, item, dead:false, sizeMul:v.sizeMul };
  round.live.add(rec);
  el.onclick = () => hit(rec);
}

function frame(now){
  if (!round) return;
  round.live.forEach(r => {
    if (r.dead) return;
    const t = (now - r.born) / r.life;
    if (t >= 1){ expire(r); return; }
    r.scale = 0.15 + t*t*2.1;
    r.radius = r.phrase.length * 6.5 * r.scale * r.sizeMul + 14;
    r.opacity = Math.min(1, t*2.4);
    r.blur = Math.max(0, 2.4 - t*10);
  });

  const arr = [...round.live].filter(r => !r.dead);
  for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++){
    const a=arr[i], b=arr[j];
    const dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy)||0.01;
    const minDist=(a.radius+b.radius)*0.85;
    if (dist < minDist){
      const overlap=minDist-dist, nx=dx/dist, ny=dy/dist, aShare=b.scale/(a.scale+b.scale);
      a.x-=nx*overlap*aShare*0.5; a.y-=ny*overlap*aShare*0.5;
      b.x+=nx*overlap*(1-aShare)*0.5; b.y+=ny*overlap*(1-aShare)*0.5;
    }
  }
  const field = $('field'), fw = field.clientWidth, fh = field.clientHeight;
  arr.forEach(r => {
    r.x = Math.min(fw - r.radius*0.3, Math.max(r.radius*0.3, r.x));
    r.y = Math.min(fh - r.radius*0.3, Math.max(r.radius*0.3, r.y));
    r.el.style.transform = `translate(${r.x}px, ${r.y}px) translate(-50%,-50%)`;
    r.el.style.opacity = r.opacity;
    r.el.style.filter = `blur(${r.blur}px)`;
    r.el.style.fontSize = (22 * r.sizeMul * r.scale) + 'px';
    r.el.style.zIndex = Math.floor(r.scale*100);
  });
  round.rafId = requestAnimationFrame(frame);
}

const removeRec = r => { r.dead = true; round.live.delete(r); r.el.remove(); };

function expire(rec){
  if (rec.dead || !round) return;
  removeRec(rec);
  /* A decoy drifting off unclicked is normal traffic, not a failure — it was
     never a word to catch. Only the target expiring counts against you. */
  if (rec.phrase !== round.target.p) return;
  round.misses++; round.streak = 0;
  syncCounters();
  round.targetSpawned = false; round.forceIn = randInt(2,3);
  round.weight[round.target.p] = Math.min(5, (round.weight[round.target.p]||1) + 2);
  pstat(round.target.p).misses++;
}

function hit(rec){
  if (rec.dead || !round) return;

  if (rec.phrase === round.target.p){
    burst(rec); removeRec(rec);
    round.hits++; round.streak++;
    syncCounters(); showContext(round.target);
    round.coverage.add(round.target.p);
    pstat(round.target.p).hits++; save();

    round.exposure[round.target.p]++;
    round.weight[round.target.p] = Math.max(1, round.weight[round.target.p] - 1);
    if (round.exposure[round.target.p] >= EXPOSURE_CAP){
      round.active = round.active.filter(it => it.p !== round.target.p);
      round.resting.push({ item: round.target, left: REST_SPAWNS });
    }
    newTarget();
  } else {
    rec.el.classList.add('wrong');
    setTimeout(() => rec.el.classList.remove('wrong'), 240);
    round.misses++; round.streak = 0;
    syncCounters();
    round.weight[round.target.p] = Math.min(5, (round.weight[round.target.p]||1) + 2);
    pstat(round.target.p).misses++; save();
    /* Name what the wrong word actually means. The error becomes input
       rather than a counter ticking up. */
    showToast(`<b>${rec.phrase}</b><span> = ${rec.item.m}</span>`);
  }
}

function syncCounters(){
  $('hitVal').textContent = round.hits;   $('barHit').textContent = round.hits;
  $('missVal').textContent = round.misses; $('barMiss').textContent = round.misses;
  $('streakVal').textContent = round.streak;
  $('streakLabel').classList.toggle('hot', round.streak >= 5);
}

let toastTimer;
function showToast(html){
  const t = $('toast'); t.innerHTML = html; t.classList.add('show'); t.classList.remove('good');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 2000);
}
function showContext(item){
  const t = $('toast');
  t.innerHTML = `<span>${item.s.replace(new RegExp(item.p,'i'), m => `<b>${m}</b>`)}</span>`;
  t.classList.add('show','good');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 1700);
}
const hideToast = () => $('toast').classList.remove('show');

function burst(rec){
  const field = $('field');
  const r = rec.el.getBoundingClientRect(), f = field.getBoundingClientRect();
  const cx = r.left-f.left+r.width/2, cy = r.top-f.top+r.height/2;
  rec.el.animate(
    [{transform:rec.el.style.transform, opacity:1},{transform:rec.el.style.transform+' scale(1.6)', opacity:0}],
    {duration:260, easing:'ease-out'});
  const cols = ['#C9A961','#FFD94A','#5ED39B','#e5e5e7'];
  for (let i=0;i<10;i++){
    const s = document.createElement('div'); s.className = 'spark';
    s.style.left = cx+'px'; s.style.top = cy+'px'; s.style.background = pick(cols);
    s.style.transition = 'transform .5s ease-out, opacity .5s ease-out';
    field.appendChild(s);
    const a = Math.random()*Math.PI*2, d = 30+Math.random()*46;
    requestAnimationFrame(()=>{ s.style.transform = `translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`; s.style.opacity = '0'; });
    setTimeout(()=>s.remove(), 520);
  }
}

/* ======================================================================
   END → SUMMARY
====================================================================== */
function stopRound(){
  if (!round) return;
  clearInterval(round.spawnTimer); clearInterval(round.clockTimer); cancelAnimationFrame(round.rafId);
  round.live.forEach(r => r.el.remove()); round.live.clear();
}

function endRound(){
  stopRound();
  const attempts = round.hits + round.misses;
  const accuracy = attempts ? round.hits/attempts : 0;
  const coverage = round.poolItems.length ? round.coverage.size/round.poolItems.length : 0;
  const before = currentStageIndex();
  let cleared = false;

  if (round.mode === 'group'){
    cleared = accuracy >= CLEAR_THRESHOLD;
    const prev = progress.groupResults[round.index];
    progress.groupResults[round.index] = {
      cleared: cleared || !!(prev && prev.cleared),
      bestAccuracy: Math.max(accuracy, prev ? prev.bestAccuracy : 0), coverage };
  } else if (round.mode === 'revision'){
    /* Revision feeds phraseStats — so mastery marks and the trial's weighting
       see the practice — but does not move the stage ladder. The Crown stays
       tied to clearing the sets themselves. */
    cleared = accuracy >= CLEAR_THRESHOLD;
    const prev = progress.revResults[round.index];
    progress.revResults[round.index] = {
      cleared: cleared || !!(prev && prev.cleared),
      bestAccuracy: Math.max(accuracy, prev ? prev.bestAccuracy : 0), coverage };
  } else {
    cleared = accuracy >= TRIAL_THRESHOLD;
    progress.trialBest = Math.max(accuracy, progress.trialBest || 0);
    if (cleared) progress.trialPassed = true;
  }
  save();

  renderSummary({ accuracy, cleared, coverage });
  const after = currentStageIndex();
  if (after > before) setTimeout(() => showStageUp(after), 550);
}

function renderSummary(res){
  showScreen('summary');
  const g = round.mode === 'group' ? GROUPS.find(x => x.id === round.index) : null;
  $('sumEyebrow').textContent = round.mode === 'trial' ? 'FINAL TRIAL'
    : round.mode === 'revision' ? `REVISION ${round.index+1}` : g.label;

  const v = $('sumVerdict');
  v.textContent = round.mode === 'trial'
    ? (res.cleared ? 'Crown earned' : 'Not yet')
    : (res.cleared ? 'Cleared' : 'Keep training');
  v.className = 'sumverdict ' + (res.cleared ? 'cleared' : 'short');

  $('sumStars').textContent = round.mode === 'trial' ? '' : starsFor(res.accuracy);
  $('sumHits').textContent = round.hits;
  $('sumMiss').textContent = round.misses;
  $('sumAcc').textContent = Math.round(res.accuracy*100) + '%';

  $('sumNote').textContent = res.cleared
    ? (round.mode === 'trial'
        ? 'Every set, held under time pressure. That is the whole job.'
        : `You met ${Math.round(res.coverage*100)}% of this set's phrases at least once.`)
    : `Needs ${Math.round((round.mode === 'trial' ? TRIAL_THRESHOLD : CLEAR_THRESHOLD)*100)}% accuracy. You reached ${Math.round(res.accuracy*100)}%.`;

  $('sumRetry').onclick = () => {
    if (round.mode === 'trial') startTrial();
    else if (round.mode === 'revision') startRevision(round.index);
    else startGroup(round.index);
  };
  $('sumNext').onclick = renderMenu;
}

function showStageUp(i){
  const s = STAGES[i], el = $('stageup');
  el.style.setProperty('--glowcol', s.glow);
  $('stageupIcon').innerHTML = svgIcon(i, s.color);
  $('stageupName').textContent = s.label;
  $('stageupDesc').textContent = s.desc;
  el.classList.add('show');
  el.onclick = () => { el.classList.remove('show'); renderMenu(); };
}

/* ======================================================================
   EVENTS
====================================================================== */
$('backBtn').onclick = () => { stopRound(); round = null; renderMenu(); };

document.querySelectorAll('.mode-btn').forEach(b => {
  b.addEventListener('click', () => {
    /* The other four modes live on the quiz page. Leaving mid-round would
       lose it silently, so stop the clock first. */
    if (!b.dataset.href) return;
    stopRound();
    location.href = b.dataset.href;
  });
});

/* Pause cleanly when the tab is hidden — otherwise the clock runs down while
   the animation frame is frozen. */
document.addEventListener('visibilitychange', () => {
  if (!round || !$('play').classList.contains('active')) return;
  if (document.hidden){
    clearInterval(round.spawnTimer); clearInterval(round.clockTimer); cancelAnimationFrame(round.rafId);
  } else {
    /* words carry an absolute birth time, so shift them forward by the gap */
    round.spawnTimer = setInterval(spawnWord, 1480);
    round.clockTimer = setInterval(tickClock, 1000);
    round.rafId = requestAnimationFrame(frame);
  }
});

boot();
</script>
</body>
</html>
