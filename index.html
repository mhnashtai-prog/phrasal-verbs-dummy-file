/* ══════════════════════════════ MATCH MODE ══════════════════════════════
   Click-to-fill, scored on Check (mirrors the word-choice quiz pattern):
   1. Tap a phrase chip in the word bank → it's "selected"
   2. Tap a blank in Column A → the phrase is placed there (pre-check state,
      shown in the mode accent colour, not yet marked right/wrong)
   3. Tapping a filled blank again releases that chip back to the bank
   4. Once every blank has a chip, Check scores the whole round at once and
      shows the results overlay (reusing the existing overlay UI)
   Colour: each phrase chip carries its verb-family colour from game-data.json
   from the start (a grouping cue). Column B (the definition) stays plain
   throughout — colour only lands on Column A once an answer is placed/checked,
   so the definition itself must still be read to make the match. */

async function ensureGameData() {
  if (gameLoaded) return;
  const data = await fetch(GAME_DATA_URL).then(r => r.json());
  gameRounds = data.rounds;
  gameLoaded = true;
}

/* Round tabs reuse the .vtab strip that normally lists verbs */
function buildRoundTabs() {
  const wrap = document.getElementById('verbTabs');
  wrap.innerHTML = '';
  gameRounds.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'vtab' + (i === roundIdx ? ' active' : '') + (roundResults[i] === 'perfect' ? ' score-perfect' : '');
    btn.textContent = 'R' + (i + 1);
    btn.style.setProperty('--verb-color', '#FFD94A');
    btn.style.setProperty('--verb-rgb', '255,217,74');
    btn.addEventListener('click', e => { e.stopPropagation(); switchRound(i); });
    wrap.appendChild(btn);
  });
  wrap.querySelectorAll('.vtab')[roundIdx]?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function switchRound(i) {
  roundIdx = i;
  matchChecked = false; matchAnswers = {}; matchSelectedId = null;
  document.querySelectorAll('#verbTabs .vtab').forEach((b, j) => b.classList.toggle('active', j === i));
  renderMatchRound();
  updateModeBadges();
}

function renderMatchRound() {
  const round = gameRounds[roundIdx];
  const rc = MATCH_ROUND_COLORS[roundIdx % MATCH_ROUND_COLORS.length];
  document.documentElement.style.setProperty('--verb-color', rc.color);
  document.documentElement.style.setProperty('--verb-rgb', rc.rgb);
  const container = document.getElementById('slidesContainer');

  // Chips: one per pair, colour-coded to its verb family, shuffled.
  const chips = shuffled(round.pairs);
  // Rows: meanings in a different shuffled order than the chips so position
  // never gives the answer away.
  const rows = shuffled(round.pairs);

  const chipsHtml = chips.map(p => `
    <button type="button" class="match-chip" data-id="${p.id}"
      onclick="onChipClick(${p.id}, this)">${p.phrase}</button>`
  ).join('');

const rowsHtml = rows.map((p, i) => `
    <div class="match-row" data-row-id="${p.id}">
      <div class="match-row-num">${i + 1}</div>
 <div class="match-meaning">${p.meaning} — <span class="match-blank" data-row-id="${p.id}" onclick="onBlankClick(${p.id})"><span class="blank-content">&nbsp;</span></span></div>
    </div>`).join('');

  container.innerHTML = `
    <div class="slide active match-slide"> 
      <div class="match-round-label">ROUND ${roundIdx + 1} / ${gameRounds.length}</div>
      <div class="match-bank">${chipsHtml}</div>
      <div class="match-rows">${rowsHtml}</div>
    </div>`;

  document.getElementById('prevBtn').disabled = roundIdx === 0;
  document.getElementById('nextBtn').disabled = roundIdx === gameRounds.length - 1;
  document.getElementById('sectionLabel').textContent = 'MATCH ROUND ' + (roundIdx + 1);

  updateMatchProgress();
}

function currentPairs() {
  return gameRounds[roundIdx].pairs;
}

function onChipClick(id, btn) {
  if (matchChecked) return;
  if (btn.classList.contains('used')) return;

  if (matchSelectedId === id) {
    // tapping the already-selected chip deselects it
    matchSelectedId = null;
    btn.classList.remove('selected');
    return;
  }

  document.querySelectorAll('.match-chip.selected').forEach(c => c.classList.remove('selected'));
  matchSelectedId = id;
  btn.classList.add('selected');
}

function onBlankClick(rowId) {
  if (matchChecked) return;
  const blank = document.querySelector(`.match-blank[data-row-id="${rowId}"]`);
  if (!blank) return;

  // Blank already filled → release it back to the bank
  if (matchAnswers[rowId] !== undefined) {
    const releasedId = matchAnswers[rowId];
    delete matchAnswers[rowId];
    const chip = document.querySelector(`.match-chip[data-id="${releasedId}"]`);
    if (chip) chip.classList.remove('used');
    blank.classList.remove('filled');
    blank.style.removeProperty('--row-color');
    blank.querySelector('.blank-content').innerHTML = '_____';
    updateMatchProgress();
    updateMatchCheckBtn();
    return;
  }

  // No chip selected — nudge, nothing to place
  if (matchSelectedId === null) return;

  const chip = document.querySelector(`.match-chip[data-id="${matchSelectedId}"]`);
  const pair = currentPairs().find(p => p.id === matchSelectedId);
  if (!chip || !pair) return;

  matchAnswers[rowId] = matchSelectedId;
  chip.classList.remove('selected');
  chip.classList.add('used');
  matchSelectedId = null;

  blank.classList.add('filled');
  blank.querySelector('.blank-content').textContent = pair.phrase;

  updateMatchProgress();
  if (Object.keys(matchAnswers).length === currentPairs().length) {
    setTimeout(checkMatchRound, 250);
  }
}

function updateMatchCheckBtn() {
  const btn = document.getElementById('matchCheckBtn');
  if (!btn) return;
  const total = currentPairs().length;
  const filled = Object.keys(matchAnswers).length;
  btn.disabled = filled < total || matchChecked;
}

function updateMatchProgress() {
  const total = currentPairs().length;
  const filled = Object.keys(matchAnswers).length;
  document.getElementById('progressFill').style.width = (filled / total * 100) + '%';
}

/* ── SCORE THE WHOLE ROUND AT ONCE ── */
function checkMatchRound() {
  if (matchChecked) return;
  const pairs = currentPairs();
  const total = pairs.length;
  if (Object.keys(matchAnswers).length < total) return;

  matchChecked = true;
  let ok = 0;

  pairs.forEach(p => {
    const blank = document.querySelector(`.match-blank[data-row-id="${p.id}"]`);
    const placedId = matchAnswers[p.id];
    const isOk = placedId === p.id;
    if (isOk) ok++;
    blank.classList.add(isOk ? 'result-ok' : 'result-err');
    if (!isOk) {
      const placedPair = pairs.find(x => x.id === placedId);
      blank.innerHTML = `<span class="blank-content">${placedPair ? placedPair.phrase : '?'}</span><span class="reveal-answer">${p.phrase}</span>`;
    }
  });

  document.querySelectorAll('.match-chip').forEach(c => c.classList.add('used'));

  scoreOk = ok; scoreErr = total - ok;
  document.getElementById('scoreOk').textContent = scoreOk;
  document.getElementById('scoreErr').textContent = scoreErr;

  const pct = Math.round(ok / total * 100);
  roundResults[roundIdx] = pct === 100 ? 'perfect' : (pct >= 50 ? 'ok' : 'poor');
  buildRoundTabs();

  showMatchResults(ok, total, pct, pairs);
}

function showMatchResults(ok, total, pct, pairs) {
  document.getElementById('ovAnswers').style.display = '';
  document.getElementById('ovBars').style.display = '';
  const perfect = pct === 100;

  document.getElementById('ovTitle').textContent = perfect ? 'Perfect!' : pct >= 80 ? 'Brilliant' : pct >= 60 ? 'Good' : 'Keep Going';
  document.getElementById('ovScore').textContent  = ok + ' / ' + total + ' · ' + pct + '%';
  document.getElementById('ovPerfect').classList.toggle('show', perfect);

  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
  document.getElementById('ovStars').innerHTML = Array.from({length:3},(_,i) =>
    `<span class="ov-star">${i < stars ? '★' : '☆'}</span>`).join('');

  document.getElementById('ovBars').innerHTML = pairs.map(p => {
    const isOk = matchAnswers[p.id] === p.id;
    return `<div class="ov-bar" style="background:${isOk ? '#4DC98A' : '#E05555'}"></div>`;
  }).join('');

  document.getElementById('ovMsg').textContent = perfect
    ? "Absolutely flawless. You've mastered this round!"
    : pct >= 80 ? 'Excellent. Review the red ones and try again.'
    : pct >= 60 ? 'Solid work — a few mixed up.'
    : 'Worth another pass on this round.';

  document.getElementById('ovAnswers').innerHTML = pairs.map((p, i) => {
    const isOk = matchAnswers[p.id] === p.id;
    const cls = isOk ? 'ok' : 'err';
    const tick = isOk ? '✓' : '✗';
    const delay = i * 40;
    return `<div class="ov-answer-item ${cls}" style="animation-delay:${delay}ms">
      <span class="ov-answer-verb">${p.phrase}</span>
      <span class="ov-answer-meaning">${p.meaning}</span>
      <span class="ov-answer-tick">${tick}</span>
    </div>`;
  }).join('');

  document.getElementById('overlay').classList.add('show');

  if (perfect) {
    triggerConfetti();
    setTimeout(() => showAwardPopup(), 300);
  }
}

/* ══════════════════════════ INCOMING — GAME MODE ══════════════════════════
   Falling-word matching game, integrated as a 5th mode. Categories:
   - each verb with >=6 particles is a standalone category tab
   - verbs with <5 particles merge into MIX 1, MIX 2 ... in original order
   - 5 PRACTICE sets interleave every verb round-robin (revision drilling)
   - TRIAL unlocks once every standalone verb + every mix is cleared
   Progress persists via localStorage with an in-memory fallback, same
   feature-detection pattern as the original engine used. Categories reuse
   the .vtab header strip (like Match's round tabs) and the falling field
   lives inside the same slide-card / overlay chrome as every other mode. */

const IG_EXPOSURE_CAP = 3, IG_REST_SPAWNS = 20, IG_ROUND_SECONDS = 120;
const IG_CLEAR_THRESHOLD = 0.60, IG_TRIAL_THRESHOLD = 0.75;
const IG_STAGES = [
  { label: 'Spark', color: '#cdbf8e' }, { label: 'Ember', color: '#e8935a' },
  { label: 'Flame', color: '#ff7a45' }, { label: 'Blaze', color: '#ff4d4d' },
  { label: 'Crown', color: '#ffd94a' },
];

let igCats = [], igAllItems = [], igCatIdx = 0, igLoaded = false, igProgress = null, igRound = null;

let igStoreUsable = true, igStoreMem = null;
try { localStorage.setItem('__ig_probe__','1'); localStorage.removeItem('__ig_probe__'); } catch(e){ igStoreUsable = false; }
function igStoreRead(){
  if (!igStoreUsable) return igStoreMem;
  try { const r = localStorage.getItem('intuity.incoming.progress.v1'); return r ? JSON.parse(r) : null; } catch(e){ return null; }
}
function igStoreWrite(d){
  igStoreMem = d;
  if (!igStoreUsable) return;
  try { localStorage.setItem('intuity.incoming.progress.v1', JSON.stringify(d)); } catch(e){ igStoreUsable = false; }
}
function igPstat(p){ if (!igProgress.phraseStats[p]) igProgress.phraseStats[p] = { hits: 0, misses: 0 }; return igProgress.phraseStats[p]; }

function igRand(a,b){ return a + Math.random()*(b-a); }
function igPick(arr){ return arr[(Math.random()*arr.length)|0]; }
function igRandInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

function ensureIgCategories(){
  if (igLoaded) return;
  buildIgCategories();
  igProgress = igStoreRead() || { catResults: {}, phraseStats: {}, trialPassed: false, trialBest: 0 };
  igLoaded = true;
}

function igMakeItem(v, it){
  const phrase = (v.id + ' ' + it.particle).toUpperCase();
  const phraseLower = (v.id + ' ' + it.particle).toLowerCase();
  const sentence = it.example.replace(/_+/, phraseLower);
  return { p: phrase, m: it.meaning, s: sentence, verb: v.id, verbLabel: v.label, color: v.color };
}

function buildIgCategories(){
  igCats = [];
  const STANDALONE_MIN = 6; // >=6 particles stays its own category; fewer merges into a MIX
  const standalone = [], smallOnes = [];
  verbs.forEach(v => (v.items.length >= STANDALONE_MIN ? standalone : smallOnes).push(v));

  // chunk the small verbs, in original data order, into ~6-7 item MIX groups
  const mixGroups = []; let cur = [], curCount = 0;
  smallOnes.forEach(v => {
    if (curCount > 0 && curCount + v.items.length > 8) { mixGroups.push(cur); cur = []; curCount = 0; }
    cur.push(v); curCount += v.items.length;
  });
  if (cur.length) mixGroups.push(cur);

  standalone.forEach(v => {
    igCats.push({ key: 'verb_'+v.id, kind: 'verb', label: v.label, color: v.color, colorRgb: v.colorRgb || hexToRgb(v.color), pool: v.items.map(it => igMakeItem(v,it)) });
  });
  mixGroups.forEach((group,i) => {
    const pool = [];
    group.forEach(v => v.items.forEach(it => pool.push(igMakeItem(v,it))));
    igCats.push({ key: 'mix_'+i, kind: 'mix', label: 'MIX '+(i+1), color: '#FFD94A', colorRgb: '255,217,74', pool });
  });

  // PRACTICE sets: round-robin one item per verb, cycling through every family,
  // so drilling never leans on just one verb — then chunked into 5 sets.
  const byVerb = {};
  verbs.forEach(v => { byVerb[v.id] = v.items.map(it => igMakeItem(v,it)); });
  const interleaved = []; let row = 0;
  const totalItems = verbs.reduce((s,v) => s+v.items.length, 0);
  while (interleaved.length < totalItems) {
    verbs.forEach(v => { const arr = byVerb[v.id]; if (arr[row]) interleaved.push(arr[row]); });
    row++;
  }
  const N_PRACTICE = 5;
  const chunk = Math.ceil(interleaved.length / N_PRACTICE);
  for (let i=0;i<N_PRACTICE;i++){
    const pool = interleaved.slice(i*chunk, i*chunk+chunk);
    if (pool.length) igCats.push({ key: 'practice_'+i, kind: 'practice', label: 'PRACTICE '+(i+1), color: '#7dd3fc', colorRgb: '125,211,252', pool });
  }

  igCats.push({ key: 'trial', kind: 'trial', label: 'TRIAL', color: '#ff4d4d', colorRgb: '255,77,77', pool: [] });

  igAllItems = [];
  igCats.forEach(c => { if (c.kind==='verb' || c.kind==='mix') igAllItems.push(...c.pool); });
}

function igCoreCategories(){ return igCats.filter(c => c.kind==='verb' || c.kind==='mix'); }
function igClearedCount(){ return igCoreCategories().filter(c => igProgress.catResults[c.key]?.cleared).length; }
function igStageThresholds(){
  const N = igCoreCategories().length;
  const s2 = Math.max(1, Math.ceil(N*0.2));
  const s3 = Math.max(s2+1, Math.ceil(N*0.45));
  const s4 = Math.max(s3+1, Math.ceil(N*0.75));
  return [0,s2,s3,s4,N];
}
function igCurrentStageIndex(){
  const T = igStageThresholds(); const c = igClearedCount();
  if (c >= T[4] && igProgress.trialPassed) return 4;
  if (c >= T[3]) return 3;
  if (c >= T[2]) return 2;
  if (c >= T[1]) return 1;
  return 0;
}
function updateIgStageLabel(){
  const el = document.getElementById('igStageLabel');
  if (!el) return;
  const idx = igCurrentStageIndex(); const T = igStageThresholds(); const cleared = igClearedCount();
  let txt = IG_STAGES[idx].label.toUpperCase();
  if (idx < 4) { const remain = Math.max(0, T[idx+1]-cleared); txt += ' · ' + remain + ' TO ' + IG_STAGES[idx+1].label.toUpperCase(); }
  else txt += ' · MASTERED';
  el.textContent = txt; el.style.color = IG_STAGES[idx].color;
}
function showIgStageFlash(stageIdx){
  const s = IG_STAGES[stageIdx];
  const el = document.getElementById('streakFlash');
  el.textContent = '✦ ' + s.label.toUpperCase() + ' REACHED ✦';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

function buildIgTabs(){
  const wrap = document.getElementById('verbTabs');
  wrap.innerHTML = '';
  const coreCleared = igCoreCategories().every(c => igProgress.catResults[c.key]?.cleared);
  igCats.forEach((c,i) => {
    const locked = c.kind==='trial' && !coreCleared;
    const btn = document.createElement('button');
    btn.className = 'vtab' + (i===igCatIdx?' active':'') + (locked?' locked':'');
    const res = igProgress.catResults[c.key] || (c.kind==='trial' && igProgress.trialPassed ? { bestAccuracy: 1 } : null);
    if (res) {
      const pct = res.bestAccuracy;
      if (pct===1) btn.classList.add('score-perfect');
      else if (pct>=.8) btn.classList.add('score-great');
      else if (pct>=.5) btn.classList.add('score-ok');
      else btn.classList.add('score-poor');
    }
    btn.textContent = c.label;
    btn.style.setProperty('--verb-color', c.color);
    btn.style.setProperty('--verb-rgb', c.colorRgb);
    if (!locked) btn.addEventListener('click', e => { e.stopPropagation(); switchIgCat(i); });
    wrap.appendChild(btn);
  });
  wrap.querySelectorAll('.vtab')[igCatIdx]?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function switchIgCat(i){
  const cat = igCats[i];
  if (cat.kind === 'trial') {
    const coreCleared = igCoreCategories().every(c => igProgress.catResults[c.key]?.cleared);
    if (!coreCleared) return;
  }
  igCatIdx = i;
  document.querySelectorAll('#verbTabs .vtab').forEach((b,j) => b.classList.toggle('active', j===i));
  beginIgRound(cat);
  updateModeBadges();
}

function igBuildTrialPool(){
  const weighted = igAllItems.map(it => {
    const st = igProgress.phraseStats[it.p];
    const missRatio = st && (st.hits+st.misses) > 0 ? st.misses/(st.hits+st.misses) : 0.5;
    return { it, w: 1 + missRatio*4 };
  });
  const bag = [];
  weighted.forEach(({it,w}) => { for (let k=0;k<Math.round(w*2);k++) bag.push(it); });
  const uniq = shuffled([...new Set(shuffled(bag).slice(0,60))]);
  const picked = uniq.slice(0,24);
  return picked.length ? picked : shuffled(igAllItems).slice(0,24);
}

function stopIgRound(){
  if (!igRound) return;
  clearInterval(igRound.spawnTimer); clearInterval(igRound.clockTimer); cancelAnimationFrame(igRound.rafId);
  igRound.live.forEach(rec => rec.el.remove());
  igRound = null;
}

function beginIgRound(cat){
  stopIgRound();
  const pool = cat.kind === 'trial' ? igBuildTrialPool() : cat.pool;
  igRound = {
    cat, poolItems: pool, active: [...pool], resting: [],
    exposure: {}, weight: {}, coverage: new Set(),
    target: null, targetSpawned: false, forceIn: 0, targetLifeBonus: 1,
    hits: 0, misses: 0, streak: 0, timeLeft: IG_ROUND_SECONDS,
    live: new Set(), spawnTimer: null, clockTimer: null, rafId: null,
  };
  pool.forEach(it => { igRound.exposure[it.p]=0; igRound.weight[it.p]=1; });
  document.documentElement.style.setProperty('--verb-color', cat.color);
  document.documentElement.style.setProperty('--verb-rgb', cat.colorRgb);
  renderIgSlide();
  scoreOk = 0; scoreErr = 0;
  document.getElementById('scoreOk').textContent = 0;
  document.getElementById('scoreErr').textContent = 0;
  igNewTarget();
  igRound.rafId = requestAnimationFrame(igFrame);
  igRound.spawnTimer = setInterval(igSpawnWord, 1480);
  igSpawnWord();
  igRound.clockTimer = setInterval(igTickClock, 1000);
}

function renderIgSlide(){
  const container = document.getElementById('slidesContainer');
  const cat = igRound.cat;
  container.innerHTML = `
    <div class="slide active incoming-slide">
      <div class="incoming-stage-label" id="igStageLabel"></div>
      <div class="incoming-hud">
        <span class="incoming-streak" id="igStreakLabel">streak <b id="igStreakVal">0</b></span>
        <span class="incoming-clock" id="igClockVal">2:00</span>
      </div>
      <div class="incoming-prompt">
        <div class="incoming-prompt-label">${cat.label} · match this meaning</div>
        <div class="incoming-prompt-text" id="igPromptText">…</div>
      </div>
      <div class="incoming-field" id="igField"></div>
      <div class="incoming-toast" id="igToast"></div>
    </div>`;
  document.getElementById('sectionLabel').textContent = '';
  document.getElementById('prevBtn').disabled = igCatIdx === 0;
  document.getElementById('nextBtn').disabled = igCatIdx === igCats.length - 1;
  updateIgStageLabel();
}

function igDefComplexity(meaning){
  const semis = (meaning.match(/;/g)||[]).length;
  const ors = (meaning.match(/\bor\b/g)||[]).length;
  return semis + ors;
}
function igWeightedPick(){
  const bag = [];
  igRound.active.forEach(it => { for (let i=0;i<igRound.weight[it.p];i++) bag.push(it); });
  return bag.length ? bag[(Math.random()*bag.length)|0] : (igRound.active[0] || igRound.poolItems[0]);
}
function igRefillFromResting(force){
  if (!igRound.resting.length) return;
  if (force) {
    igRound.resting.sort((a,b) => a.left-b.left);
    const rec = igRound.resting.shift();
    igRound.exposure[rec.item.p]=0; igRound.weight[rec.item.p]=1;
    igRound.active.push(rec.item);
  }
}
function igTickRestCounters(){
  for (let i=igRound.resting.length-1;i>=0;i--){
    igRound.resting[i].left--;
    if (igRound.resting[i].left<=0){
      const rec = igRound.resting.splice(i,1)[0];
      igRound.exposure[rec.item.p]=0; igRound.weight[rec.item.p]=1;
      igRound.active.push(rec.item);
    }
  }
}
function igNewTarget(){
  if (!igRound.active.length) igRefillFromResting(true);
  igRound.target = igWeightedPick();
  const el = document.getElementById('igPromptText');
  if (el) el.textContent = igRound.target.m;
  igRound.targetSpawned = false;
  const complexity = igDefComplexity(igRound.target.m);
  igRound.forceIn = igRandInt(3,5) + complexity;
  igRound.targetLifeBonus = 1 + complexity*0.22;
}

function igDecoyItem(){
  if (Math.random() < 0.35) {
    const fam = igAllItems.filter(it => it.verb === igRound.target.verb && it.p !== igRound.target.p);
    if (fam.length) return igPick(fam);
  }
  const universe = igRound.active.concat(igRound.resting.map(r => r.item));
  return universe.length ? igPick(universe) : igRound.target;
}

function igFindSpawnSpot(field, fw, fh){
  let best = null, bestScore = -1;
  for (let i=0;i<10;i++){
    const cx = igRand(fw*.14, fw*.86), cy = igRand(fh*.12, fh*.84);
    let minDist = Infinity;
    igRound.live.forEach(rec => { const d = Math.hypot(cx-rec.x, cy-rec.y) - (rec.radius||20); if (d<minDist) minDist=d; });
    if (minDist > bestScore){ bestScore = minDist; best = {x:cx,y:cy}; }
  }
  return best;
}

function igSpawnWord(){
  if (!igRound) return;
  igTickRestCounters();
  let item;
  if (!igRound.targetSpawned) {
    igRound.forceIn--;
    item = igRound.forceIn <= 0 ? igRound.target : igDecoyItem();
  } else {
    item = igDecoyItem();
  }
  if (item.p === igRound.target.p) igRound.targetSpawned = true;

  const field = document.getElementById('igField');
  if (!field) return;
  const el = document.createElement('div');
  el.className = 'incoming-word';
  el.textContent = item.p;
  el.style.color = item.color;

  const fw = field.clientWidth, fh = field.clientHeight;
  const spot = igFindSpawnSpot(field, fw, fh);
  const pace = Math.max(0.78, 1 - igRound.streak*0.02);
  const isTarget = item.p === igRound.target.p;
  const lifeBonus = isTarget ? (igRound.targetLifeBonus||1) : 1;
  const life = igRand(6200,9200) * pace * lifeBonus;
  const born = performance.now();

  field.appendChild(el);
  const rec = { el, x: spot.x, y: spot.y, born, life, phrase: item.p, item, dead: false };
  igRound.live.add(rec);
  el.addEventListener('click', () => igHit(rec));
}

function igFrame(now){
  if (!igRound) return;
  igRound.live.forEach(rec => {
    if (rec.dead) return;
    const t = (now - rec.born) / rec.life;
    if (t >= 1) { igMiss(rec); return; }
    const scale = 0.18 + t*t*1.9;
    rec.scale = scale;
    rec.radius = rec.phrase.length*6.2*scale + 14;
    rec.opacity = Math.min(1, t*2.4);
    rec.blur = Math.max(0, 2.2 - t*9);
  });
  const arr = [...igRound.live].filter(r => !r.dead);
  for (let i=0;i<arr.length;i++){
    for (let j=i+1;j<arr.length;j++){
      const a=arr[i], b=arr[j];
      const dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy)||0.01;
      const minDist=(a.radius+b.radius)*0.85;
      if (dist<minDist){
        const overlap=minDist-dist, nx=dx/dist, ny=dy/dist, aShare=b.scale/(a.scale+b.scale);
        a.x -= nx*overlap*aShare*0.5; a.y -= ny*overlap*aShare*0.5;
        b.x += nx*overlap*(1-aShare)*0.5; b.y += ny*overlap*(1-aShare)*0.5;
      }
    }
  }
  const field = document.getElementById('igField');
  if (field) {
    const fw = field.clientWidth, fh = field.clientHeight;
    arr.forEach(rec => {
      rec.x = Math.min(fw-rec.radius*0.3, Math.max(rec.radius*0.3, rec.x));
      rec.y = Math.min(fh-rec.radius*0.3, Math.max(rec.radius*0.3, rec.y));
      rec.el.style.transform = `translate(${rec.x}px, ${rec.y}px) translate(-50%,-50%)`;
      rec.el.style.opacity = rec.opacity;
      rec.el.style.filter = `blur(${rec.blur}px)`;
      rec.el.style.fontSize = (20*rec.scale) + 'px';
      rec.el.style.zIndex = Math.floor(rec.scale*100);
    });
  }
  igRound.rafId = requestAnimationFrame(igFrame);
}

function igRemoveRec(rec){ rec.dead = true; igRound.live.delete(rec); rec.el.remove(); }

function igUpdateStreak(){
  const v = document.getElementById('igStreakVal');
  const lbl = document.getElementById('igStreakLabel');
  if (v) v.textContent = igRound.streak;
  if (lbl) lbl.classList.toggle('hot', igRound.streak >= 5);
  if (igRound.streak > 0 && igRound.streak % 3 === 0) {
    const el = document.getElementById('streakFlash');
    const msgs = ['🔥 ' + igRound.streak + ' in a row!', '⚡ ' + igRound.streak + ' streak!', '✨ ' + igRound.streak + ' correct!'];
    el.textContent = msgs[Math.floor(Math.random()*msgs.length)];
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }
}

let igToastTimer;
function igShowToast(html){
  const t = document.getElementById('igToast'); if (!t) return;
  t.innerHTML = html; t.classList.add('show');
  clearTimeout(igToastTimer); igToastTimer = setTimeout(igHideToast, 1800);
}
function igShowContext(item){
  const t = document.getElementById('igToast'); if (!t) return;
  const sentence = item.s.replace(new RegExp(item.p,'i'), `<b>${item.p}</b>`);
  t.innerHTML = `<span>${sentence}</span>`;
  t.classList.add('show');
  clearTimeout(igToastTimer); igToastTimer = setTimeout(igHideToast, 1600);
}
function igHideToast(){ const t = document.getElementById('igToast'); if (t) t.classList.remove('show'); }

function igBurst(rec){
  const field = document.getElementById('igField'); if (!field) return;
  const cols = ['#C9A961','#FFD94A','#4DC98A','#e5e5e7'];
  const rect = rec.el.getBoundingClientRect(); const fr = field.getBoundingClientRect();
  const cx = rect.left-fr.left+rect.width/2, cy = rect.top-fr.top+rect.height/2;
  for (let i=0;i<8;i++){
    const s = document.createElement('div');
    s.style.cssText = `position:absolute;width:5px;height:5px;border-radius:50%;left:${cx}px;top:${cy}px;background:${igPick(cols)};pointer-events:none;transition:transform .5s ease-out, opacity .5s ease-out;z-index:9`;
    field.appendChild(s);
    const a = Math.random()*Math.PI*2, d = 26+Math.random()*40;
    requestAnimationFrame(() => { s.style.transform = `translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`; s.style.opacity='0'; });
    setTimeout(() => s.remove(), 520);
  }
}

function igMiss(rec){
  if (rec.dead || !igRound) return;
  igRemoveRec(rec);
  if (rec.phrase !== igRound.target.p) return;
  igRound.misses++; igRound.streak = 0;
  scoreErr = igRound.misses;
  document.getElementById('scoreErr').textContent = scoreErr;
  igUpdateStreak();
  igRound.targetSpawned = false; igRound.forceIn = igRandInt(2,3);
  igRound.weight[igRound.target.p] = Math.min(5, (igRound.weight[igRound.target.p]||1) + 2);
  igPstat(igRound.target.p).misses++;
}

function igHit(rec){
  if (rec.dead || !igRound) return;
  if (rec.phrase === igRound.target.p) {
    igBurst(rec); igRemoveRec(rec);
    igRound.hits++; igRound.streak++;
    scoreOk = igRound.hits;
    document.getElementById('scoreOk').textContent = scoreOk;
    igUpdateStreak(); igHideToast(); igShowContext(igRound.target);
    igRound.coverage.add(igRound.target.p);
    igPstat(igRound.target.p).hits++;
    igStoreWrite(igProgress);
    igRound.exposure[igRound.target.p] = (igRound.exposure[igRound.target.p]||0) + 1;
    igRound.weight[igRound.target.p] = Math.max(1, (igRound.weight[igRound.target.p]||1) - 1);
    if (igRound.exposure[igRound.target.p] >= IG_EXPOSURE_CAP) {
      igRound.active = igRound.active.filter(it => it.p !== igRound.target.p);
      igRound.resting.push({ item: igRound.target, left: IG_REST_SPAWNS });
    }
    igNewTarget();
  } else {
    rec.el.classList.add('wrong');
    setTimeout(() => rec.el.classList.remove('wrong'), 260);
    igRound.misses++; igRound.streak = 0;
    scoreErr = igRound.misses;
    document.getElementById('scoreErr').textContent = scoreErr;
    igUpdateStreak();
    igRound.weight[igRound.target.p] = Math.min(5, (igRound.weight[igRound.target.p]||1) + 2);
    igPstat(igRound.target.p).misses++;
    if (igRound.weight[rec.phrase] !== undefined) igRound.weight[rec.phrase] = Math.min(5, igRound.weight[rec.phrase] + 1);
    igStoreWrite(igProgress);
    igShowToast(`<b>${rec.phrase}</b><span> not quite — keep watching.</span>`);
  }
}

function igTickClock(){
  igRound.timeLeft--;
  const el = document.getElementById('igClockVal');
  if (el) { el.textContent = igFmtClock(igRound.timeLeft); el.classList.toggle('low', igRound.timeLeft<=15); }
  if (igRound.timeLeft <= 0) endIgRound();
}
function igFmtClock(s){ const m = Math.floor(s/60); const sec = s%60; return m + ':' + String(sec).padStart(2,'0'); }

function endIgRound(){
  clearInterval(igRound.spawnTimer); clearInterval(igRound.clockTimer); cancelAnimationFrame(igRound.rafId);
  igRound.live.forEach(rec => rec.el.remove());
  const attempts = igRound.hits + igRound.misses;
  const accuracy = attempts ? igRound.hits/attempts : 0;
  const coveragePct = igRound.poolItems.length ? igRound.coverage.size/igRound.poolItems.length : 0;
  const cat = igRound.cat;
  const stageBefore = igCurrentStageIndex();
  let cleared = false;
  if (cat.kind === 'trial') {
    cleared = accuracy >= IG_TRIAL_THRESHOLD;
    igProgress.trialBest = Math.max(accuracy, igProgress.trialBest || 0);
    if (cleared) igProgress.trialPassed = true;
  } else {
    cleared = accuracy >= IG_CLEAR_THRESHOLD;
    const prev = igProgress.catResults[cat.key];
    igProgress.catResults[cat.key] = { cleared: cleared || (prev && prev.cleared), bestAccuracy: Math.max(accuracy, prev ? prev.bestAccuracy : 0), coverage: coveragePct };
  }
  igStoreWrite(igProgress);
  buildIgTabs();
  updateIgStageLabel();
  showIgResults(igRound.hits, igRound.misses, accuracy, cleared, coveragePct, cat);
  const stageAfter = igCurrentStageIndex();
  if (stageAfter > stageBefore) setTimeout(() => showIgStageFlash(stageAfter), 700);
  updateModeBadges();
}

function showIgResults(hits, misses, accuracy, cleared, coveragePct, cat){
  const pct = Math.round(accuracy*100);
  const perfect = pct === 100;
  document.getElementById('ovTitle').textContent = cat.kind === 'trial' ? (cleared ? 'Crown Earned' : 'Not Yet') : (cleared ? 'Cleared' : 'Keep Training');
  document.getElementById('ovScore').textContent = hits + ' hit · ' + misses + ' missed · ' + pct + '%';
  document.getElementById('ovPerfect').classList.toggle('show', perfect);
  const stars = pct>=90?3:pct>=70?2:pct>=50?1:0;
  document.getElementById('ovStars').innerHTML = Array.from({length:3},(_,i) => `<span class="ov-star">${i<stars?'★':'☆'}</span>`).join('');
  document.getElementById('ovBars').style.display = 'none';
  document.getElementById('ovBars').innerHTML = '';
  document.getElementById('ovMsg').textContent = cat.kind === 'trial'
    ? (cleared ? "Every family in the set, held under time pressure. That's the whole job." : `Needs ${Math.round(IG_TRIAL_THRESHOLD*100)}% accuracy. You reached ${pct}% — try again.`)
    : (cleared ? `Coverage: you met ${Math.round(coveragePct*100)}% of this set's phrases at least once.` : `Needs ${Math.round(IG_CLEAR_THRESHOLD*100)}% accuracy to clear. You reached ${pct}%.`);
  document.getElementById('ovAnswers').style.display = 'none';
  document.getElementById('ovAnswers').innerHTML = '';
  document.getElementById('overlay').classList.add('show');
  if (perfect) { triggerConfetti(); setTimeout(() => showAwardPopup(), 300); }
}

loadAll();
