<style>

    display:flex; flex-direction:column; position:relative; overflow:hidden;

  .prompttext{font-size:clamp(.85rem,2.2vw,1rem)}

  .field{position:relative; flex:1; min-height:0; margin:.6rem .6rem 1rem; perspective:600px; overflow:hidden}
  .field::before{ /* vignette so words feel like they're arriving out of dark */

he arrangements."}, {"particle": "up", "meaning": "to telephone; to summon for military service", "example": "Let me _____ my friend who's an expert in this field."}]}, {"id": "give", "label": "GIVE", "color": "#6a4374", "items": [{"particle": "up", "meaning": "to stop trying; to surrender", "example": "Don't _____ trying - you can learn anything if you practice enough!"}, {"particle": "away", "meaning": "to donate; to reveal a secret", "example": "She decided to _____ her old clothes to charity."}]}, {"id": "pick", "label": "PICK", "color": "#b4453a", "items": [{"particle": "up", "meaning": "to lift; to collect; to learn; to improve", "example": "Can you _____ some milk from the shop on your way home?"}, {"particle": "out", "meaning": "to select or identify", "example": "I couldn't _____ my sister from all the people in the crowd."}]}, {"id": "drop", "label": "DROP", "color": "#2f5f8e", "items": [{"particle": "off", "meaning": "to deliver; to fall asleep; to decrease", "example": "I'll _____ the kids at school at 8am tomorrow morning."}]}, {"id": "set", "label": "SET", "color": "#8f5320", "items": [{"particle": "up", "meaning": "to establish; to arrange; to frame someone", "example": "They're planning to _____ a new business in the city center."}, {"particle": "off", "meaning": "to begin a journey; to cause to explode; to enhance by contrast", "example": "What time do you want to _____ for the airport tomorrow morning?"}, {"particle": "out", "meaning": "to begin a journey; to intend; to arrange systematically", "example": "We _____ to solve the mystery but found no evidence."}]}, {"id": "make", "label": "MAKE", "color": "#d1495b", "items": [{"particle": "up", "meaning": "to resolve differences after an argument; to constitute; to invent a story", "example": "The two friends decided to _____ after their argument."}, {"particle": "out", "meaning": "to discern or understand with difficulty", "example": "I could barely _____ the handwriting on the old letter."}, {"particle": "over", "meaning": "to transfer something formally; to renovate", "example": "The government agreed to _____ the land to the local council."}, {"particle": "into", "meaning": "to transform something into something else", "example": "Developers plan to _____ the old railway station a thriving community centre."}, {"particle": "for", "meaning": "to result in or contribute to something", "example": "Such low wages and high rents _____ real hardship for many families."}, {"particle": "with", "meaning": "to provide or offer something (informal)", "example": "After weeks of criticism, the minister finally _____ an apology."}, {"particle": "off", "meaning": "to flee, especially with something stolen", "example": "The burglars managed to _____ before the police arrived."}, {"particle": "against", "meaning": "to count against something; to be a factor working against", "example": "Several factors _____ introducing the scheme nationwide."}, {"particle": "of", "meaning": "to interpret or understand the significance of something", "example": "It's hard to know what to _____ of the government's latest announcement."}, {"particle": "at", "meaning": "to rush or move aggressively toward someone", "example": "The dog suddenly _____ the postman as he opened the gate."}]}, {"id": "see", "label": "SEE", "color": "#8a9a5b", "items": [{"particle": "out", "meaning": "to remain until the end of a period or term; to escort someone to the door", "example": "The minister is determined to _____ the remainder of her term in office."}, {"particle": "to", "meaning": "to deal with, arrange, or attend to something", "example": "Don't worry about the repairs - I'll _____ it myself."}, {"particle": "off", "meaning": "to accompany a departing person; to successfully deal with a challenge", "example": "The champions managed to _____ a determined challenge from their rivals."}, {"particle": "in", "meaning": "to celebrate the start of something, like a new year", "example": "Thousands gathered in the square to _____ the new year."}, {"particle": "through", "meaning": "to not be deceived by something; to support someone until completion", "example": "Experienced voters can usually _____ empty political promises."}, {"particle": "about", "meaning": "to arrange or deal with something", "example": "I'll _____ getting the tickets booked for next week."}, {"particle": "over", "meaning": "to be shown around a property", "example": "The estate agent offered to let us _____ the property before we decided."}, {"particle": "for", "meaning": "to verify something personally (see for oneself)", "example": "Come and _____ yourself how much progress we've made."}, {"particle": "around", "meaning": "to be shown around a place", "example": "Visitors are welcome to _____ the historic building during the open weekend."}, {"particle": "against", "meaning": "to evaluate or interpret something in a wider context", "example": "Analysts should always _____ these figures the wider economic background."}]}]}</script>
<script>
/* ------------------------------------------------------------------
   Item bank now comes from a real dataset (embedded above) instead of
   a hand-picked demo list. It's flattened once into FULL_POOL; the
   curriculum layer below decides how much of it is actually live.
------------------------------------------------------------------- */
const DATA = JSON.parse(document.getElementById('verbData').textContent);

const FULL_POOL = [];
const FIRST_OF_VERB = [];
DATA.verbs.forEach(v => {
  v.items.forEach((it, idx) => {
    const phrase = (v.id + ' ' + it.particle).toUpperCase();
    const phraseLower = (v.id + ' ' + it.particle).toLowerCase();
    const sentence = it.example.replace(/_+/, phraseLower);
    const obj = { p: phrase, m: it.meaning, s: sentence, verb: v.id, color: v.color };
    FULL_POOL.push(obj);
    if (idx === 0) FIRST_OF_VERB.push(obj);
  });
});

/* ---------- curriculum: start small, unlock as items are actually learned ---------- */
const INITIAL_COUNT = 8;      // verb families to start with (their most common form each)
const UNLOCK_BATCH = 4;       // new phrases introduced per unlock
const MASTERY_HITS = 2;       // correct hits needed, with no outstanding struggle, to count as "known"
const UNLOCK_RATIO = 0.65;    // fraction of the active set that must be known to trigger the next batch

const activePool = [];
const activeSet = new Set();
const weight = {};            // phrase -> 1..5, higher = shown more often (struggling)
const hitCount = {};          // phrase -> correct hits so far

function addToActive(item){
  if(activeSet.has(item.p)) return;
  activeSet.add(item.p);
  activePool.push(item);
  weight[item.p] = 1;
  hitCount[item.p] = 0;
}

FIRST_OF_VERB.slice(0, INITIAL_COUNT).forEach(addToActive);

function isKnown(p){ return (hitCount[p]||0) >= MASTERY_HITS && weight[p] <= 1; }

/* Fires after every correct hit. Once most of what's currently live has
   actually been retained (not just seen), the next batch loads — new
   verb families are preferred over new senses of a verb already active,
   so variety grows before depth does. */
function checkUnlock(){
  if(activePool.length >= FULL_POOL.length) return;
  const known = activePool.filter(it => isKnown(it.p)).length;
  if(known / activePool.length < UNLOCK_RATIO) return;

  const remaining = FULL_POOL.filter(it => !activeSet.has(it.p));
  if(!remaining.length) return;
  const activeVerbs = new Set(activePool.map(it => it.verb));
  const newFamilies = remaining.filter(it => !activeVerbs.has(it.verb));
  const pool = newFamilies.length ? newFamilies : remaining;
  const batch = shuffle(pool).slice(0, UNLOCK_BATCH);
  batch.forEach(addToActive);
  if(batch.length) announceUnlock(batch);
  updateLoadedHud();
}

function updateLoadedHud(){
  $('loadedVal').textContent = activePool.length;
  $('totalVal').textContent = FULL_POOL.length;
}

function announceUnlock(batch){
  const names = [...new Set(batch.map(it => it.verb))].join(', ').toUpperCase();
  const t = $('toast');
  t.innerHTML = `<b>+${batch.length} new</b><span> phrases just unlocked — ${names}</span>`;
  t.classList.remove('good');
  t.classList.add('show','unlock');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 2400);
}

const $ = id => document.getElementById(id);
const field = $('field');
const rand = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[(Math.random()*arr.length)|0];
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0; [b[i],b[j]]=[b[j],b[i]];} return b; };

let target = null, hits = 0, misses = 0, streak = 0;
let targetSpawned = false, forceIn = 0;
const live = new Set();
let spawnTimer = null;

function weightedPick(){
  const bag = [];
  activePool.forEach(w => { for(let i=0;i<weight[w.p];i++) bag.push(w); });
  return bag[(Math.random()*bag.length)|0];
}

/* Four distinct type personalities, so the board never looks like one
   template repeated — each carries its own case treatment because e.g.
   a script face loses all its character in full caps. */
const STYLES = [
  { family:"'Space Grotesk',sans-serif", weight:700, style:'normal', case:'upper', tracking:'.01em', sizeMul:1.00 },  // modern
  { family:"'Fraunces',serif",           weight:600, style:'italic', case:'title', tracking:'0em',   sizeMul:1.05 },  // classic
  { family:"'Archivo Black',sans-serif", weight:400, style:'normal', case:'upper', tracking:'-.01em', sizeMul:0.92 }, // bold/blocky
  { family:"'Bungee',cursive",           weight:400, style:'normal', case:'upper', tracking:'0em',   sizeMul:0.85 },  // fun/display
  { family:"'Caveat',cursive",           weight:700, style:'normal', case:'title', tracking:'.01em', sizeMul:1.35 },  // handwritten/fun
];

function styledText(phrase, cased){
  if(cased === 'title'){
    return phrase.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  }
  return phrase;
}

const randInt = (a,b) => a + Math.floor(Math.random()*(b-a+1));

function newTarget(){
  target = weightedPick();
  $('promptText').textContent = target.m;
  targetSpawned = false;
  forceIn = randInt(3,5);
}

function findSpawnSpot(fw, fh){
  let best = null, bestScore = -1;
  for(let i=0;i<10;i++){
    const cx = rand(fw*.18, fw*.82), cy = rand(fh*.15, fh*.8);
    let minDist = Infinity;
    live.forEach(rec => {
      const d = Math.hypot(cx-rec.x, cy-rec.y) - (rec.radius||20);
      if(d < minDist) minDist = d;
    });
    if(minDist > bestScore){ bestScore = minDist; best = {x:cx, y:cy}; }
  }
  return best;
}

function spawnWord(){
  let item;
  if(!targetSpawned){
    forceIn--;
    item = forceIn <= 0 ? target : weightedPick();
  } else {
    item = weightedPick();
  }
  if(item.p === target.p) targetSpawned = true;

  const el = document.createElement('div');
  el.className = 'word';
  const variant = pick(STYLES);
  el.textContent = styledText(item.p, variant.case);
  el.dataset.phrase = item.p;
  el.style.fontFamily = variant.family;
  el.style.fontWeight = variant.weight;
  el.style.fontStyle = variant.style;
  el.style.letterSpacing = variant.tracking;
  el.style.color = item.color;         // verb-family colour, matches the wider curriculum's colour coding

  const fw = field.clientWidth, fh = field.clientHeight;
  const {x, y} = findSpawnSpot(fw, fh);
  const pace = Math.max(0.72, 1 - streak * 0.02);
  const life = rand(5400, 8200) * pace;
  const born = performance.now();

  field.appendChild(el);
  const rec = {el, x, y, born, life, phrase:item.p, dead:false, sizeMul:variant.sizeMul};
  live.add(rec);

  el.addEventListener('click', () => hit(rec));
}

function frame(now){
  live.forEach(rec => {
    if(rec.dead) return;
    const t = (now - rec.born) / rec.life;
    if(t >= 1){ miss(rec); return; }
    const scale = 0.15 + t*t*2.1;
    const opacity = Math.min(1, t*2.4);
    const blur = Math.max(0, 2.4 - t*10);
    rec.scale = scale;
    rec.radius = rec.phrase.length * 6.5 * scale * rec.sizeMul + 14;
    rec.opacity = opacity;
    rec.blur = blur;
  });

  const arr = [...live].filter(r => !r.dead);
  for(let i=0;i<arr.length;i++){
    for(let j=i+1;j<arr.length;j++){
      const a = arr[i], b = arr[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx,dy) || 0.01;
      const minDist = (a.radius + b.radius) * 0.85;
      if(dist < minDist){
        const overlap = (minDist - dist);
        const nx = dx/dist, ny = dy/dist;
        const aShare = b.scale / (a.scale + b.scale);
        a.x -= nx * overlap * aShare * 0.5;
        a.y -= ny * overlap * aShare * 0.5;
        b.x += nx * overlap * (1-aShare) * 0.5;
        b.y += ny * overlap * (1-aShare) * 0.5;
      }
    }
  }

  const fw = field.clientWidth, fh = field.clientHeight;
  arr.forEach(rec => {
    rec.x = Math.min(fw - rec.radius*0.3, Math.max(rec.radius*0.3, rec.x));
    rec.y = Math.min(fh - rec.radius*0.3, Math.max(rec.radius*0.3, rec.y));
    rec.el.style.transform = `translate(${rec.x}px, ${rec.y}px) translate(-50%,-50%)`;
    rec.el.style.opacity = rec.opacity;
    rec.el.style.filter = `blur(${rec.blur}px)`;
    rec.el.style.fontSize = (22 * rec.sizeMul * rec.scale) + 'px';
    rec.el.style.zIndex = Math.floor(rec.scale*100);
  });

  requestAnimationFrame(frame);
}

function removeRec(rec){
  rec.dead = true;
  live.delete(rec);
  rec.el.remove();
}

function miss(rec){
  if(rec.dead) return;
  removeRec(rec);
  misses++; streak = 0;
  $('missVal').textContent = misses;
  updateStreak();
  if(rec.phrase === target.p){
    targetSpawned = false; forceIn = randInt(2,3);
    weight[target.p] = Math.min(5, weight[target.p] + 2);
    hitCount[target.p] = 0;             // an unfound target resets its "known" progress
  }
}

function hit(rec){
  if(rec.dead) return;
  if(rec.phrase === target.p){
    burst(rec);
    removeRec(rec);
    hits++; streak++;
    $('hitVal').textContent = hits;
    updateStreak();
    hideToast();
    showContext(target);
    weight[target.p] = Math.max(1, weight[target.p] - 1);
    hitCount[target.p] = (hitCount[target.p]||0) + 1;
    checkUnlock();
    newTarget();
  } else {
    rec.el.classList.add('wrong');
    rec.el.animate(
      [{transform: rec.el.style.transform}, {transform: rec.el.style.transform + ' translateX(-6px)'},
       {transform: rec.el.style.transform + ' translateX(6px)'}, {transform: rec.el.style.transform}],
      {duration:220}
    );
    setTimeout(()=> rec.el.classList.remove('wrong'), 220);
    misses++; streak = 0;
    $('missVal').textContent = misses;
    updateStreak();
    weight[target.p] = Math.min(5, weight[target.p] + 2);
    hitCount[target.p] = 0;
    if(weight[rec.phrase] !== undefined){
      weight[rec.phrase] = Math.min(5, weight[rec.phrase] + 1);
      hitCount[rec.phrase] = 0;
    }
    showToast(`<b>${rec.phrase}</b><span> that's not it — keep watching.</span>`);
  }
}

function updateStreak(){
  $('streakVal').textContent = streak;
  $('streakLabel').classList.toggle('hot', streak >= 5);
}

let toastTimer;
function showToast(html){
  const t = $('toast'); t.innerHTML = html; t.classList.add('show');
  t.classList.remove('good','unlock');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 1800);
}
function showContext(item){
  const t = $('toast');
  const sentence = item.s.replace(new RegExp(item.p,'i'), `<b>${item.p}</b>`);
  t.innerHTML = `<span>${sentence}</span>`;
  t.classList.remove('unlock');
  t.classList.add('show','good');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 1600);
}
function hideToast(){ $('toast').classList.remove('show'); }

function burst(rec){
  const rect = rec.el.getBoundingClientRect();
  const fr = field.getBoundingClientRect();
  const cx = rect.left - fr.left + rect.width/2;
  const cy = rect.top - fr.top + rect.height/2;

  rec.el.animate(
    [{transform: rec.el.style.transform, opacity:1, filter:'blur(0px)'},
     {transform: rec.el.style.transform + ' scale(1.6)', opacity:0, filter:'blur(2px)'}],
    {duration:260, easing:'ease-out'}
  );

  const cols = ['#C9A961','#FFD94A','#5ED39B','#e8e6e1'];
  for(let i=0;i<10;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = cx+'px'; s.style.top = cy+'px';
    s.style.background = pick(cols);
    s.style.transition = 'transform .5s ease-out, opacity .5s ease-out';
    field.appendChild(s);
    const a = Math.random()*Math.PI*2, d = 30 + Math.random()*46;
    requestAnimationFrame(()=>{
      s.style.transform = `translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;
      s.style.opacity = '0';
    });
    setTimeout(()=>s.remove(), 520);
  }
}

/* ---------- run ---------- */
$('subline').textContent =
  `${DATA.level} phrasal verbs, ${DATA.verbs.length} families. Starts with ${activePool.length} — more unlock automatically as you actually learn them.`;
updateLoadedHud();
newTarget();
requestAnimationFrame(frame);
spawnTimer = setInterval(spawnWord, 1300);
spawnWord();

</script>
